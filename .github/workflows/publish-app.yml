name: Publish app

# Actions tab > Publish app > Run workflow. Opens a PR adding apps/<name>.caddy.
# Merging it lets the app deploy and serves it under waynezhu.dev. Its database
# and the like come from the app's own infra.yml, on its deploys.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".

on:
  workflow_dispatch:
    inputs:
      name:
        description: App repo name, lowercase (e.g. notes)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate app config
        env:
          NAME: ${{ inputs.name }}
        run: scripts/publish-app.sh "$NAME"

      - name: Validate Caddy config
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/apps:/etc/caddy/apps:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Open PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: publish-app/${{ inputs.name }}
          commit-message: Publish app ${{ inputs.name }}
          title: Publish app ${{ inputs.name }}
          body: |
            Adds `apps/${{ inputs.name }}.caddy`, serving `waynezhu.dev/apps/${{ inputs.name }}/` from `sites/${{ inputs.name }}` and `waynezhu.dev/api/${{ inputs.name }}/` from `${{ inputs.name }}-backend:3001`.

            On merge, the Deploy workflow reloads Caddy and the deployer starts accepting `${{ inputs.name }}`'s deploys. Its database is created on its first deploy if its `infra.yml` has `postgres: true`.
