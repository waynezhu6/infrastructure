name: Register app

# Actions tab > Register app > Run workflow. Opens a PR adding apps/<name>.caddy.
# Merging it routes the domain to the app and creates its database on deploy.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".

on:
  workflow_dispatch:
    inputs:
      name:
        description: App repo name, lowercase (e.g. notes)
        required: true
      domain:
        description: Public hostname; leave empty for <name>.waynezhu.dev
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate app config
        env:
          NAME: ${{ inputs.name }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          scripts/register-app.sh "$NAME" "$DOMAIN"
          echo "DOMAIN=$(awk '/ {$/ {print $1; exit}' "apps/$NAME.caddy")" >> "$GITHUB_ENV"

      - name: Validate Caddy config
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/apps:/etc/caddy/apps:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Open PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: register-app/${{ inputs.name }}
          commit-message: Register app ${{ inputs.name }}
          title: Register app ${{ inputs.name }} (${{ env.DOMAIN }})
          body: |
            Adds `apps/${{ inputs.name }}.caddy`, routing `${{ env.DOMAIN }}` to `${{ inputs.name }}-backend:3001` and `sites/${{ inputs.name }}`.

            On merge, the Deploy workflow reloads Caddy and creates the `${{ inputs.name }}` database and role.

            Subdomains of waynezhu.dev already resolve through the wildcard record. For any other domain, point an `A` record for `${{ env.DOMAIN }}` at the server before the app's first deploy.
