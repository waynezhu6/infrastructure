name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catch a broken Caddyfile or app block before it reaches the server.
      - name: Validate Caddy config
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/apps:/etc/caddy/apps:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # The server never talks to GitHub: CI copies the checked-out files over.
      # --inplace rewrites files without replacing them, so Caddy's single-file
      # bind mount of the Caddyfile sees the new contents on reload.
      # No --delete, so server-only files (.env, sites/, secrets/, backups) are
      # never removed. apps/ is the exception: it mirrors the repo exactly, so
      # deleting an app's file unpublishes it.
      - name: Copy files to server
        env:
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          ssh "$TARGET" "mkdir -p ~/infrastructure"
          rsync -rlptz --inplace \
            --exclude=.git/ --exclude=.github/ --exclude=.env --exclude='sites/*/' \
            --exclude=secrets/ --exclude=apps/ \
            ./ "$TARGET:~/infrastructure/"
          rsync -rlptz --inplace --delete apps/ "$TARGET:~/infrastructure/apps/"

      - name: Write .env
        env:
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > deploy.env
          scp deploy.env "$TARGET:~/infrastructure/.env"

      # App databases are created by the deployer on each app's deploy, from
      # its infra.yml (deployer/src/provision.ts).
      - name: Start services, reload Caddy
        env:
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          ssh "$TARGET" 'set -e
            cd ~/infrastructure
            chmod 600 .env
            docker compose up -d --build
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile'
