name: Deploy to waynezhu.dev
description: >
  Asks the deployer on the server to run an app's backend image and publish the
  frontend inside it. Proves which repo is asking with a GitHub OIDC token, so
  the app repo needs no deploy secrets; the job needs `permissions: id-token: write`.
  The deploy's output streams into this step's log, and the step fails if the
  deploy does.

inputs:
  digest:
    description: Digest of the pushed backend image (sha256:...), e.g. docker/build-push-action's `digest` output.
    required: true
  env:
    description: >
      Extra environment for the backend: one NAME=value line per variable,
      each value usually one of the app repo's secrets. List them by name
      rather than passing toJSON(secrets), which GitHub flags as possibly
      malicious. Values must be single-line; NODE_ENV, PORT and DATABASE_URL
      are the server's and can't be set here.
    default: ""
  manifest:
    description: >
      The app's infra.yml, relative to the checkout: what the server should
      provision for it (e.g. "postgres: true"). Sent with each deploy; if the
      file doesn't exist, nothing is provisioned. The job must check out the
      repo first.
    default: infra.yml
  url:
    description: The deployer's address. Also the OIDC audience.
    default: https://waynezhu.dev/deploy

runs:
  using: composite
  steps:
    - name: Deploy
      shell: bash
      env:
        DIGEST: ${{ inputs.digest }}
        DEPLOY_URL: ${{ inputs.url }}
        DEPLOY_ENV: ${{ inputs.env }}
        MANIFEST: ${{ inputs.manifest }}
      run: "$GITHUB_ACTION_PATH/deploy.sh"
