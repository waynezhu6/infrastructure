services:
  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps:/etc/caddy/apps:ro
      - ./sites:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy-web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database server
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

  # Deploys apps when their CI asks (deployer/), at waynezhu.dev/deploy.
  # Callers prove which repo they are with a GitHub OIDC token, and each repo
  # can only deploy its own app's image.
  deployer:
    build: ./deployer
    container_name: deployer
    restart: unless-stopped
    environment:
      DEPLOY_OWNER: waynezhu6
      DEPLOY_OWNER_ID: "48568003"
    volumes:
      # Pulls images and runs app containers through the host's Docker. That is
      # root-equivalent, as the deploy user's docker group already is.
      - /var/run/docker.sock:/var/run/docker.sock
      # The deploy user's GHCR login (bootstrap.sh --ghcr-user), to pull
      # private app images. Fails loudly rather than creating an empty one.
      - type: bind
        source: ${HOME}/.docker/config.json
        target: /root/.docker/config.json
        read_only: true
        bind:
          create_host_path: false
      - ./apps:/infra/apps:ro
      # Writable: provisioning adds DATABASE_URL lines (deployer/src/provision.ts).
      - ./secrets:/infra/secrets
      - ./sites:/infra/sites
      # Deploy logs (deploys/logs/<app>/<id>.log) and which image each app runs.
      - ./deploys:/data
    networks:
      - caddy-web
    # A restart waits for running deploys to finish.
    stop_grace_period: 3m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/deploy/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# Named volumes for data persistence
volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  postgres_data:
    name: postgres_data

# Networks that projects can reference as "external: true"
networks:
  caddy-web:
    name: caddy-web
    driver: bridge
  postgres-db:
    name: postgres-db
    driver: bridge
